name: Publish FAI SDK

on:
  push:
    tags:
      - "fai-sdk@*"
  pull_request:
    branches:
      - app


env:
  PACKAGE_NAME: "@fern-api/fai-sdk"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}
  NPM_TOKEN: ${{ secrets.FERN_NPM_TOKEN }}

jobs:
  publish_sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Install
        uses: ./.github/actions/install

      - name: 🧪 Build and test
        run: pnpm turbo codegen build test --filter=${{ env.PACKAGE_NAME }}

      - name: Publish FAI SDK
        env:
          NPM_TOKEN: ${{ secrets.FERN_NPM_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git_version="0.0.0"
          else
            git_version="$(scripts/fai-sdk-version.sh)"
          fi
          cd packages/fai-sdk
          mv package.json package.json.tmp
          version_replace="s/\"version\": \"[^\"]*\"/\"version\": \"${git_version}\"/"
          cat package.json.tmp| sed "${version_replace}" > package.json
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          rm -rf package.json.tmp
          npm publish --access public
