default-group: local

groups:
  local:
    generators:
      - name: fernapi/fern-typescript-node-sdk
        version: 2.0.0
        output:
          location: npm
          url: npm.buildwithfern.com
          package-name: "@fern-api/fai-sdk"
        github:
          repository: fern-api/fai-sdk
      - name: fernapi/fern-fastapi-server
        version: 1.8.0
        output:
          location: local-file-system
          path: ../../../servers/fai/fern/
