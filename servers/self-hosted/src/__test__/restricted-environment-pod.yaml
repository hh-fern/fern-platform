apiVersion: v1
kind: Namespace
metadata:
  name: fern-test
---
apiVersion: v1
kind: Pod
metadata:
  name: fern-restricted-test
  namespace: fern-test
spec:
  securityContext:
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: fern-docs
      image: fern-self-hosted:latest
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: false
      ports:
        - containerPort: 5432
          hostPort: 5434
        - containerPort: 9000
          hostPort: 9000
        - containerPort: 8080
          hostPort: 8080
        - containerPort: 3000
          hostPort: 3000
        - containerPort: 7700
          hostPort: 7700
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      env:
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres@localhost:5432/fdr"
  volumes:
    - name: postgres-data
      emptyDir: {}
  restartPolicy: Never
